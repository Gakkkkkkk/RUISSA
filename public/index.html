<html lang="zh-CN">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">

<title>俄罗斯 9 日 · 6 人行程手册</title>
<style>
:root{
  --bg:#f6f4ee;--card:#fffdf8;--card2:#f2efe6;--ink:#1d1f22;--dim:#6b6f76;--faint:#9a9ea6;
  --line:rgba(0,0,0,.13);--line2:rgba(0,0,0,.07);
  --accent:#b4443c;--accentBg:#fbe9e7;--ok:#1f7a5c;--okBg:#e3f2ec;
  --land:#efece1;--sea:#e7eef2;
  --c1:#c2762c;--c2:#2f6fb5;--c3:#6a4fb0;--c4:#1f8a72;--c5:#b4443c;--c6:#8a6a2e;--c7:#3e8bb8;--c8:#9a5a9e;--c9:#4f8a4a;
}
html[data-theme="dark"]{
  --bg:#14161a;--card:#1c1f24;--card2:#23272d;--ink:#e9e7e2;--dim:#9aa0a8;--faint:#767c85;
  --line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.07);
  --accent:#e07a70;--accentBg:#2c201f;--ok:#5fbf98;--okBg:#1d2b26;
  --land:#232830;--sea:#1a2129;
  --c1:#e0a94e;--c2:#6fa8e8;--c3:#a98ae8;--c4:#45bf9e;--c5:#e07a70;--c6:#c2a05a;--c7:#6fb6de;--c8:#c08ac4;--c9:#7cc072;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--ink);
  font:400 15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 80px}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:.01em}
a{color:inherit}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px 12px 18px 10px;padding:16px 16px 14px;margin:14px 0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.sec{margin-top:26px}
.sec>h2{font-size:19px;margin-bottom:2px}
.sec>.sub{font-size:13px;color:var(--dim);margin-bottom:12px}

/* now card */
#now{background:var(--card);border:1.5px solid var(--line);border-radius:20px 14px 22px 12px;padding:18px 16px 16px;margin:16px 0 6px}
#now .lab{font-size:12px;letter-spacing:.12em;color:var(--faint)}
#now .ev{font-size:20px;font-weight:600;line-height:1.35;margin:6px 0 2px}
#now .ev small{display:block;font-size:13px;font-weight:400;color:var(--dim);margin-top:3px}
#cd{display:flex;gap:8px;margin:14px 0 4px}
#cd .u{flex:1;background:var(--card2);border:1px solid var(--line2);border-radius:12px 9px 13px 8px;padding:10px 4px 8px;text-align:center}
#cd .n{font-size:30px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
#cd .l{font-size:11px;color:var(--faint);margin-top:6px;letter-spacing:.08em}
#now .tz{font-size:12.5px;color:var(--dim);margin-top:10px;line-height:1.7}
#now .tz b{font-weight:600;color:var(--ink)}
#now.done .n{color:var(--ok)}

/* map */
.mapbox{background:var(--card);border:1.5px solid var(--line);border-radius:16px 12px 18px 10px;padding:8px 6px 4px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto}
.nights{display:flex;gap:5px;flex-wrap:wrap;padding:8px 10px 12px}
.night{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--dim);background:var(--card2);border:1px solid var(--line2);border-radius:999px;padding:4px 9px 4px 6px}
.night i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.night s{text-decoration:none;color:var(--faint)}

/* orders */
.ord{background:var(--card);border:1.5px solid var(--line);border-radius:16px 12px 18px 10px;padding:14px 15px;margin:12px 0}
.ord .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.ord .hd b{font-size:15px;font-weight:600}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line2);color:var(--dim)}
.tag.ok{background:var(--okBg);border-color:transparent;color:var(--ok)}
.tag.warn{background:var(--accentBg);border-color:transparent;color:var(--accent)}
.ord dl{margin:0;display:grid;grid-template-columns:64px 1fr;gap:6px 10px;font-size:13.5px}
.ord dt{color:var(--faint);font-size:12.5px;padding-top:1px}
.ord dd{margin:0;word-break:break-word}
.mask{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.06em}
.seats{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}
.seat{font-size:11.5px;background:var(--card2);border:1px solid var(--line2);border-radius:7px;padding:3px 7px;color:var(--dim)}

/* days */
.day{background:var(--card);border:1.5px solid var(--line);border-radius:16px 12px 18px 10px;margin:12px 0;overflow:hidden}
.day>summary{list-style:none;cursor:pointer;padding:14px 15px;display:flex;align-items:center;gap:11px}
.day>summary::-webkit-details-marker{display:none}
.dot{width:26px;height:26px;flex:none;border-radius:9px 7px 10px 6px;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;color:#fff}
.day .who{flex:1;min-width:0}
.day .who b{display:block;font-size:15px;font-weight:600}
.day .who span{font-size:12.5px;color:var(--dim)}
.caret{color:var(--faint);font-size:12px;flex:none;transition:transform .18s}
.day[open] .caret{transform:rotate(90deg)}
.body{padding:0 15px 14px}
.route{display:flex;align-items:center;gap:0;overflow-x:auto;padding:6px 0 10px;-webkit-overflow-scrolling:touch}
.rs{display:flex;align-items:center;flex:none}
.rs .pt{width:9px;height:9px;border-radius:50%;flex:none;border:2px solid var(--card)}
.rs .lb{font-size:11.5px;color:var(--dim);margin:0 7px 0 4px;white-space:nowrap}
.rs .ln{width:22px;height:1.5px;background:var(--line);flex:none}
.navbtn{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 12px;font-size:13px;text-decoration:none;color:var(--ink);margin-bottom:12px}
.tl{border-left:1.5px solid var(--line);margin-left:4px;padding-left:0}
.ti{position:relative;padding:0 0 14px 16px}
.ti:last-child{padding-bottom:2px}
.ti:before{content:"";position:absolute;left:-5.5px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--card);border:1.5px solid var(--faint)}
.ti .t{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.ti .h{font-size:14.5px;font-weight:600;margin:1px 0 2px}
.ti .p{font-size:13px;color:var(--dim);line-height:1.6}
.ti .p a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.book{display:inline-block;font-size:11px;color:var(--accent);background:var(--accentBg);border-radius:6px;padding:2px 7px;margin-top:5px}
.warnln{display:inline-block;font-size:11.5px;color:var(--accent);margin-top:5px}
.anchor{background:var(--card2);border-left:2.5px solid var(--accent);border-radius:0 8px 8px 0;margin:2px 0 10px;padding:8px 11px;font-size:13px}

/* todos + tips */
ul.plain{list-style:none;margin:0;padding:0}
ul.plain li{position:relative;padding:9px 0 9px 22px;border-bottom:1px solid var(--line2);font-size:14px;line-height:1.6}
ul.plain li:last-child{border-bottom:0}
ul.plain li:before{content:"";position:absolute;left:3px;top:17px;width:6px;height:6px;border-radius:2px;background:var(--faint)}
ul.plain li.hot:before{background:var(--accent)}
ul.plain li em{font-style:normal;color:var(--dim);font-size:13px}
.tips{display:grid;gap:10px}
.tip{background:var(--card);border:1.5px solid var(--line);border-radius:14px 10px 16px 9px;padding:12px 14px;font-size:13.5px;line-height:1.7}
.tip b{display:block;font-size:13.5px;margin-bottom:3px}
.tip span{color:var(--dim)}
footer{text-align:center;color:var(--faint);font-size:12px;margin-top:34px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">

<div id="now"></div>
<div class="mapbox" id="map"></div>

<div class="sec">
  <h2>已确认的订单</h2>

  <div id="orders"></div>
</div>

<div class="sec">
  <h2>逐日行程</h2>
  <div class="sub">点标题展开当日路线，可一键打开全天多点导航。带标记的项目需要提前订票。</div>
  <div id="days"></div>
</div>

<div class="sec">
  <h2>待办清单</h2>
  <div class="sub">办完一项告诉我，我来改这一页。</div>
  <div class="card"><ul class="plain" id="todos"></ul></div>
</div>

<div class="sec">
  <h2>实用贴士</h2>
  <div class="sub">时差、电话、支付、保暖，出发前过一遍。</div>
  <div class="tips" id="tips"></div>
</div>

<footer>
  俄罗斯 9 日 · 6 人 · 2027.02.04 – 02.13<br>
  页面所有时间都带时区，在任何地方打开都不会算错
</footer>
</div>

/* ---- theme ---- */
function theme(){
  var sys=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches;
  var h=new Date().getHours();
  var night=(h>=19||h<7);
  document.documentElement.setAttribute("data-theme",(sys||night)?"dark":"light");
}
theme();setInterval(theme,60000);

/* ---- now card ---- */
var nowEl=document.getElementById("now");
function nextAnchor(){
  var now=Date.now();
  for(var i=0;i<ANCHORS.length;i++){if(ANCHORS[i].ms>now)return ANCHORS[i];}
  return null;
}
function renderNow(){
  var a=nextAnchor();
  if(!a){
    nowEl.className="done";
    nowEl.innerHTML='<div class="lab">此刻关注</div><div class="ev">行程已结束<small>2027 年 2 月 13 日 11:50 抵达上海浦东 T1</small></div>';
    return;
  }
  nowEl.className="";
  nowEl.innerHTML=
   '<div class="lab">此刻关注 · 下一个行程事件</div>'+
   '<div class="ev">'+a.t+'<small>'+a.p+'</small></div>'+
   '<div id="cd">'+
     '<div class="u"><div class="n" id="dd">--</div><div class="l">天</div></div>'+
     '<div class="u"><div class="n" id="hh">--</div><div class="l">时</div></div>'+
     '<div class="u"><div class="n" id="mm">--</div><div class="l">分</div></div>'+
     '<div class="u"><div class="n" id="ss">--</div><div class="l">秒</div></div>'+
   '</div>'+
   '<div class="tz">'+
     "<b>当地时间</b> "+fmt(a.ms,a.off)+"　（UTC"+(a.off>=0?"+":"")+(a.off/60)+"）<br>"+
     "<b>北京时间</b> "+fmt(a.ms,CN)+"　（UTC+8）"+
   '</div>';
}
function tick(){
  var a=nextAnchor();
  if(!a){renderNow();return;}
  var box=document.getElementById("dd");
  if(!box){renderNow();return;}
  var s=Math.floor((a.ms-Date.now())/1000);
  if(s<0)s=0;
  document.getElementById("dd").textContent=Math.floor(s/86400);
  document.getElementById("hh").textContent=pad(Math.floor(s%86400/3600));
  document.getElementById("mm").textContent=pad(Math.floor(s%3600/60));
  document.getElementById("ss").textContent=pad(s%60);
}
renderNow();tick();setInterval(tick,1000);

    var right=n.x>560;
    s+='<text x="'+(right?n.x-14:n.x+14)+'" y="'+(n.y+3)+'" font-size="13" font-weight="600" fill="var(--ink)" text-anchor="'+(right?"end":"start")+'">'+n.n+'</text>';
    s+='<text x="'+(right?n.x-14:n.x+14)+'" y="'+(n.y+19)+'" font-size="10.5" fill="var(--dim)" text-anchor="'+(right?"end":"start")+'">'+n.sub+'</text>';
  });
  s+='</svg>';
  var nightsHtml=[
    {d:1,c:"var(--c1)",t:"2/4 莫斯科"},{d:2,c:"var(--c2)",t:"2/5 莫斯科"},{d:3,c:"var(--c3)",t:"2/6 莫斯科"},
    {d:4,c:"var(--c4)",t:"2/7 摩尔曼斯克"},{d:5,c:"var(--c5)",t:"2/8 摩尔曼斯克"},{d:6,c:"var(--c6)",t:"2/9 摩尔曼斯克"},
    {d:7,c:"var(--c7)",t:"2/10 圣彼得堡"},{d:8,c:"var(--c8)",t:"2/11 圣彼得堡"}
  ].map(function(n){return '<span class="night"><i style="background:'+n.c+'"></i>'+n.t+'</span>';}).join("");
  document.getElementById("map").innerHTML=s+'<div class="nights">'+nightsHtml+'<span class="night"><s>共 8 晚</s></span></div>';
})();

/* ---- orders ---- */
document.getElementById("orders").innerHTML=ORDERS.map(function(o){
  var rows=o.rows.map(function(r){return "<dt>"+r[0]+"</dt><dd>"+r[1]+"</dd>";}).join("");
  return '<div class="ord"><div class="hd"><b>'+o.name+'</b><span class="tag '+o.state+'">'+o.tag+"</span>"+
    (o.link?' <a class="navbtn" style="margin:0;padding:3px 9px;font-size:12px" href="'+mapUrl(o.link)+'" target="_blank" rel="noopener">地图</a>':'')+
    '</div><dl>'+rows+"</dl></div>";
}).join("");

/* ---- days ---- */
document.getElementById("days").innerHTML=DAYS.map(function(day,i){
  var col="var("+C[i]+")";
  var stops=day.items.filter(function(it){return it.k&&PL[it.k];}).map(function(it){return PL[it.k];});
  var seen={},uniq=[];
  stops.forEach(function(p){var k=p.join(",");if(!seen[k]){seen[k]=1;uniq.push(p);}});
  var route=day.items.filter(function(it){return it.k&&PL[it.k];}).map(function(it,idx){
    var p=PL[it.k];var k=p.join(",");
    if(seen["r"+k])return "";seen["r"+k]=1;
    return '<div class="rs"><span class="pt" style="background:'+col+'"></span><span class="lb">'+it.h.replace(/（.*?）/g,"")+"</span>"+(idx<day.items.length-1?'<span class="ln"></span>':"")+"</div>";
  }).join("");
  var body=day.items.map(function(it){
    var time=it.nt?it.nt.replace("2027-","")+" "+it.t:it.t;
    var p=it.p||"";
    if(it.k&&PL[it.k]&&p)p=A(p,PL[it.k]);
    return '<div class="ti">'+
      '<div class="t">'+time+"　UTC"+(it.off>=0?"+":"")+(it.off/60)+"</div>"+
      '<div class="h">'+it.h+"</div>"+
      (p?'<div class="p">'+p+"</div>":"")+
      (it.book?'<div class="book">需提前订票 / 预约</div>':"")+
      (it.warn?'<div class="warnln">'+it.warn+"</div>":"")+
    "</div>";
  }).join("");
  return '<details class="day"'+(i===0?" open":"")+'>'+
    '<summary><span class="dot" style="background:'+col+'">D'+day.d+"</span>"+
    '<span class="who"><b>'+day.dt+" "+day.wd+"　"+day.city+"</b><span>住 "+day.night+"</span></span>"+
    '<span class="caret">▸</span></summary>'+
    '<div class="body">'+
      '<div class="route">'+route+"</div>"+
      (uniq.length?'<a class="navbtn" href="'+routeUrl(uniq)+'" target="_blank" rel="noopener">打开全天多点导航（'+(uniq.length)+" 站）</a>":"")+
      '<div class="tl">'+body+"</div>"+
    "</div></details>";
}).join("");

/* ---- todos ---- */
document.getElementById("todos").innerHTML=TODOS.map(function(t){
  return '<li'+(t[0]==="hot"?' class="hot"':"")+">"+t[1]+"</li>";
}).join("");

/* ---- tips ---- */
document.getElementById("tips").innerHTML=TIPS.map(function(t){
  return '<div class="tip"><b>'+t[0]+"</b><span>"+t[1]+"</span></div>";
}).join("");
})();
</script>
</body>
</html>
